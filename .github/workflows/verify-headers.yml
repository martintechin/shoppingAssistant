name: Verify security headers

on:
  push:
    branches:
      - claude/publish-md-remaining-tuxz7n
    paths:
      - .github/workflows/verify-headers.yml
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site URL to check"
        required: false
        default: "https://icy-desert-0015e7303.7.azurestaticapps.net"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check security headers
        run: |
          SITE_URL="${{ inputs.site_url || 'https://icy-desert-0015e7303.7.azurestaticapps.net' }}"
          curl -sSI "$SITE_URL" | tee headers.txt
          status=0
          for h in content-security-policy strict-transport-security x-frame-options; do
            if grep -qi "^$h:" headers.txt; then
              echo "OK: $h present"
            else
              echo "MISSING: $h"
              status=1
            fi
          done
          exit $status
