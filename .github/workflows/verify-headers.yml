name: Verify security headers

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site URL to check (defaults to the SITE_URL repository variable)"
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check security headers
        run: |
          SITE_URL="${{ inputs.site_url || vars.SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            echo "No site URL given: pass the site_url input or set the SITE_URL repository variable."
            exit 1
          fi
          curl -sSI "$SITE_URL" | tee headers.txt
          status=0
          for h in content-security-policy strict-transport-security x-frame-options; do
            if grep -qi "^$h:" headers.txt; then
              echo "OK: $h present"
            else
              echo "MISSING: $h"
              status=1
            fi
          done
          exit $status
