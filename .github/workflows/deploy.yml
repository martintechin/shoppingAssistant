name: Deploy Infrastructure & App

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure (Bicep)'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  # Deployment targets are read from GitHub Actions repository variables
  # (Settings → Secrets and variables → Actions → Variables) with defaults
  # that a fork can leave untouched. SWA_NAME is derived from APP_NAME so it
  # always matches Bicep's swa-${appName}.
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'rg-shoppingassistant-prod' }}
  LOCATION: ${{ vars.LOCATION || 'swedencentral' }}
  SWA_LOCATION: ${{ vars.SWA_LOCATION || 'westeurope' }}
  APP_NAME: ${{ vars.APP_NAME || 'shoppingassistant' }}
  SWA_NAME: swa-${{ vars.APP_NAME || 'shoppingassistant' }}

jobs:
  # ---------- Infrastructure (Bicep) ----------
  infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_infra == 'true'
    outputs:
      deployment-token: ${{ steps.get-token.outputs.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: bicep
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_LANGUAGE: ${{ vars.APP_LANGUAGE || 'en' }}
        run: |
          output=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              appName="$APP_NAME" \
              location="$LOCATION" \
              swaLocation="$SWA_LOCATION" \
              jwtSecret="$JWT_SECRET" \
              appLanguage="$APP_LANGUAGE" \
            --query "properties.outputs" -o json)

          echo "storage-account=$(echo "$output" | jq -r '.storageAccountName.value')" >> "$GITHUB_OUTPUT"
          echo "app-url=$(echo "$output" | jq -r '.staticWebAppUrl.value')" >> "$GITHUB_OUTPUT"

      - name: Seed first activation code
        run: |
          STORAGE_ACCOUNT="${{ steps.bicep.outputs.storage-account }}"
          APP_URL="${{ steps.bicep.outputs.app-url }}"

          CONN_STR=$(az storage account show-connection-string \
            --resource-group "$RESOURCE_GROUP" \
            --name "$STORAGE_ACCOUNT" \
            --query connectionString -o tsv)

          # Skip if an active code already exists (idempotent on re-deploy)
          EXISTING=$(az storage entity query \
            --table-name DeviceAuth \
            --connection-string "$CONN_STR" \
            --filter "PartitionKey eq 'code' and status eq 'active'" \
            --select RowKey \
            --num-results 1 \
            --query "items[0].RowKey" -o tsv 2>/dev/null || true)

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "None" ]; then
            echo "### Activation Code" >> "$GITHUB_STEP_SUMMARY"
            echo "An active activation code already exists — skipping generation." >> "$GITHUB_STEP_SUMMARY"
            echo "To generate a new code, use **Settings → Devices** in the app." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Generate code: XXXX-XXXX-XXXX from charset ABCDEFGHJKLMNPQRSTUVWXYZ23456789
          CHARSET="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
          CODE=""
          for g in 1 2 3; do
            SEGMENT=""
            for c in 1 2 3 4; do
              RAND=$(od -An -tu4 -N4 /dev/urandom | tr -d ' ')
              INDEX=$(( RAND % 32 ))
              SEGMENT="${SEGMENT}${CHARSET:$INDEX:1}"
            done
            [ -n "$CODE" ] && CODE="${CODE}-${SEGMENT}" || CODE="$SEGMENT"
          done

          az storage entity insert \
            --table-name DeviceAuth \
            --connection-string "$CONN_STR" \
            --entity PartitionKey=code RowKey="$CODE" status=active

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
### First Activation Code

Your app is ready at: **${APP_URL}**

Use this code to activate your first device:

\`\`\`
${CODE}
\`\`\`

> This code is single-use. After activating, generate additional codes from **Settings → Devices** in the app.
EOF

      - name: Get SWA deployment token
        id: get-token
        run: |
          token=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.apiKey" --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

  # ---------- Build & Test (skip on PR close — nothing to build) ----------
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            api/node_modules
            frontend/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('api/package-lock.json', 'frontend/package-lock.json') }}

      - name: Install & build API
        working-directory: api
        run: npm ci && npm run build

      - name: Install & build Frontend
        working-directory: frontend
        env:
          VITE_LANGUAGE: ${{ vars.APP_LANGUAGE || 'en' }}
        run: npm ci && npm run build

      - name: Test API
        working-directory: api
        run: npm test

      - name: Test Frontend
        working-directory: frontend
        run: npm test

  # ---------- Deploy App (on push to main) ----------
  deploy:
    name: Deploy App to SWA
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build API
        working-directory: api
        run: npm ci --omit=optional && npm run build

      - name: Prune API to production deps
        working-directory: api
        run: npm prune --omit=dev --omit=optional

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_LANGUAGE: ${{ vars.APP_LANGUAGE || 'en' }}
        run: npm ci && npm run build

      - name: Deploy to Azure Static Web Apps
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          npx --yes @azure/static-web-apps-cli deploy \
            ./frontend/dist \
            --api-location ./api \
            --api-language node \
            --api-version 22 \
            --deployment-token ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }} \
            --env production

  # ---------- Deploy App (after infra provisioning) ----------
  deploy-after-infra:
    name: Deploy App (after infra)
    runs-on: ubuntu-latest
    needs: [infra, build]
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_infra == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build API
        working-directory: api
        run: npm ci --omit=optional && npm run build

      - name: Prune API to production deps
        working-directory: api
        run: npm prune --omit=dev --omit=optional

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_LANGUAGE: ${{ vars.APP_LANGUAGE || 'en' }}
        run: npm ci && npm run build

      - name: Deploy to Azure Static Web Apps
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          npx --yes @azure/static-web-apps-cli deploy \
            ./frontend/dist \
            --api-location ./api \
            --api-language node \
            --api-version 22 \
            --deployment-token ${{ needs.infra.outputs.deployment-token }} \
            --env production

  # ---------- Deploy Preview (on PR open/update) ----------
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build API
        working-directory: api
        run: npm ci --omit=optional && npm run build

      - name: Prune API to production deps
        working-directory: api
        run: npm prune --omit=dev --omit=optional

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_LANGUAGE: ${{ vars.APP_LANGUAGE || 'en' }}
        run: npm ci && npm run build

      - name: Deploy to preview environment
        run: |
          npx --yes @azure/static-web-apps-cli deploy \
            ./frontend/dist \
            --api-location ./api \
            --api-language node \
            --api-version 22 \
            --deployment-token ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }} \
            --env "pull-${{ github.event.pull_request.number }}"

  # ---------- Close Preview (on PR close/merge) ----------
  close-preview:
    name: Close Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete preview environment
        run: |
          az staticwebapp environment delete \
            --name "$SWA_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --environment-name "pull-${{ github.event.pull_request.number }}" \
            --yes
