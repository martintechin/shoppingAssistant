name: Deploy Infrastructure & App

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure (Bicep)'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  # Deployment targets are read from GitHub Actions repository variables
  # (Settings → Secrets and variables → Actions → Variables) with defaults
  # that a fork can leave untouched. SWA_NAME is derived from APP_NAME so it
  # always matches Bicep's swa-${appName}.
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'rg-shoppingassistant-prod' }}
  LOCATION: ${{ vars.LOCATION || 'swedencentral' }}
  SWA_LOCATION: ${{ vars.SWA_LOCATION || 'westeurope' }}
  APP_NAME: ${{ vars.APP_NAME || 'shoppingassistant' }}
  OWNER_TAG: ${{ vars.OWNER_TAG || 'shoppingassistant' }}
  SWA_NAME: swa-${{ vars.APP_NAME || 'shoppingassistant' }}

jobs:
  # ---------- Infrastructure (Bicep) ----------
  infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_infra == 'true'
    outputs:
      deployment-token: ${{ steps.get-token.outputs.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_LANGUAGE: ${{ vars.APP_LANGUAGE || 'en' }}
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              appName="$APP_NAME" \
              location="$LOCATION" \
              swaLocation="$SWA_LOCATION" \
              ownerTag="$OWNER_TAG" \
              jwtSecret="$JWT_SECRET" \
              appLanguage="$APP_LANGUAGE"

      - name: Get SWA deployment token
        id: get-token
        run: |
          token=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.apiKey" --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

  # ---------- Build & Test ----------
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            api/node_modules
            frontend/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('api/package-lock.json', 'frontend/package-lock.json') }}

      - name: Install & build API
        working-directory: api
        run: npm ci && npm run build

      - name: Install & build Frontend
        working-directory: frontend
        env:
          VITE_LANGUAGE: ${{ vars.APP_LANGUAGE || 'en' }}
        run: npm ci && npm run build

      - name: Test API
        working-directory: api
        run: npm test

      - name: Test Frontend
        working-directory: frontend
        run: npm test

  # ---------- Deploy App (on push to main) ----------
  deploy:
    name: Deploy App to SWA
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build API
        working-directory: api
        run: npm ci --omit=optional && npm run build

      - name: Prune API to production deps
        working-directory: api
        run: npm prune --omit=dev --omit=optional

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_LANGUAGE: ${{ vars.APP_LANGUAGE || 'en' }}
        run: npm ci && npm run build

      - name: Deploy to Azure Static Web Apps
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          npx --yes @azure/static-web-apps-cli deploy \
            ./frontend/dist \
            --api-location ./api \
            --api-language node \
            --api-version 22 \
            --deployment-token ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }} \
            --env production

  # ---------- Deploy App (after infra provisioning) ----------
  deploy-after-infra:
    name: Deploy App (after infra)
    runs-on: ubuntu-latest
    needs: [infra, build]
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_infra == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build API
        working-directory: api
        run: npm ci --omit=optional && npm run build

      - name: Prune API to production deps
        working-directory: api
        run: npm prune --omit=dev --omit=optional

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_LANGUAGE: ${{ vars.APP_LANGUAGE || 'en' }}
        run: npm ci && npm run build

      - name: Deploy to Azure Static Web Apps
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          npx --yes @azure/static-web-apps-cli deploy \
            ./frontend/dist \
            --api-location ./api \
            --api-language node \
            --api-version 22 \
            --deployment-token ${{ needs.infra.outputs.deployment-token }} \
            --env production
